app = "task-sync"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "8000"
  DATA_DIR = "/data"

[[mounts]]
  source = "task_data"
  destination = "/data"
